<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hurbilketa-erroreak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Diseinua: pantaila bakarra (1000x600 koordenatu-espazioa, erantzuleki eskalatua), azpian azpitituluak eta denbora-kontrolak. */
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#18212D; --muted:#5A6677; --line:#D6DCE5;
  --real:#1F5FBF; --approx:#B85C00; --abs:#7B3FB0; --rel:#0B7A72;
  --ok:#2E7D32; --bad:#B3261E; --onc:#FFFFFF;
  --ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --math:'Source Serif 4','Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A; --panel:#161D27; --ink:#E8EDF4; --muted:#9BA7B8; --line:#2A3543;
    --real:#79ADFF; --approx:#F2A65E; --abs:#C9A2F2; --rel:#55D3C8;
    --ok:#7BD389; --bad:#FF8F86; --onc:#0E131A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A; --panel:#161D27; --ink:#E8EDF4; --muted:#9BA7B8; --line:#2A3543;
  --real:#79ADFF; --approx:#F2A65E; --abs:#C9A2F2; --rel:#55D3C8;
  --ok:#7BD389; --bad:#FF8F86; --onc:#0E131A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;margin:0;padding-inline:16px;padding-block:20px}
.app{max-width:1040px;margin-inline:auto;display:grid;gap:12px;min-width:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--real);outline-offset:2px}

.wrap{position:relative;width:100%;aspect-ratio:1000/600;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#st{position:absolute;left:0;top:0;width:1000px;height:600px;transform-origin:0 0}
#sv{position:absolute;left:0;top:0;width:1000px;height:600px;overflow:visible}
.ln{stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round}

/* Elementuak */
.a{position:absolute;opacity:0;white-space:nowrap;line-height:1.25}
.ctr{text-align:center}
.sp{display:inline-block}
.rect{transform-origin:left center}
.dot{border-radius:50%;transform-origin:center}
.bg-real{background:var(--real)} .bg-approx{background:var(--approx)} .bg-abs{background:var(--abs)} .bg-rel{background:var(--rel)} .bg-muted{background:var(--muted)}
.c-real{color:var(--real)} .c-approx{color:var(--approx)} .c-abs{color:var(--abs)} .c-rel{color:var(--rel)} .c-ok{color:var(--ok)} .c-bad{color:var(--bad)}
.k-abs{--c:var(--abs)} .k-rel{--c:var(--rel)}
.ttl{font-weight:700;font-size:26px}
.big{font-size:60px;font-weight:700}
.sub{font-size:28px;color:var(--muted)}
.lab{font-size:17px;letter-spacing:.09em;font-weight:700}
.axl{font-size:22px;font-weight:700}
.tk{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:19px;color:var(--muted)}
.stm{font-size:21px;color:var(--muted);line-height:1.4;white-space:normal}
.barl{font-size:19px;font-weight:700;color:var(--onc)}
.rowl{font-size:24px}
.win{border:2px dashed var(--muted);border-radius:6px;background:transparent}
.panel{border:1.5px dashed var(--muted);border-radius:10px}
.band{background:color-mix(in srgb,var(--ok) 16%,transparent);border:2px dashed var(--ok);border-radius:8px}
.ring{border-radius:50%;border:4px solid var(--ok);transform-origin:center}
.ring.bad{border-color:var(--bad)}
.concl{font-size:24px;line-height:1.45;white-space:normal;border:1.5px solid var(--line);border-radius:10px;padding:16px 20px;background:var(--panel)}
.card2{white-space:normal;border:1.5px solid var(--line);border-radius:12px;padding:14px 22px;background:var(--panel)}
.card2 .lab{margin-bottom:4px}
.chip{display:inline-flex;gap:.55em;align-items:baseline;padding:.3em .8em;border-radius:8px;font-family:var(--math);font-size:24px;background:color-mix(in srgb,var(--c) 13%,var(--panel));border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.chip b{color:var(--c);font-weight:600}
.chip sub{font-size:.62em;font-family:var(--ui)}

.math{font-family:var(--math);line-height:1.5}
.math i{font-style:italic}
.math sub{font-size:.62em;font-style:normal;font-family:var(--ui)}
.math b{font-weight:600}
.fz28{font-size:28px}.fz34{font-size:34px}.fz38{font-size:38px}.fz44{font-size:44px}.fz64{font-size:64px;line-height:1.2}
.abs{display:inline-flex;align-items:center;border-left:.07em solid currentColor;border-right:.07em solid currentColor;padding:.05em .32em;margin:0 .12em}
.abs.sp{display:inline-flex}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.3}
.frac .n{border-bottom:.06em solid currentColor;padding:0 .3em .08em}
.frac .d{padding:.08em .3em 0}

/* Azpitituluak eta kontrolak */
.cap{font-size:clamp(17px,2.3vw,22px);line-height:1.5;min-height:3.2em;padding:2px 4px;transition:opacity .25s ease}
.cap.out{opacity:0}
input[type=range]{width:100%;accent-color:var(--ink);height:28px;margin:0;cursor:pointer}
.chap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chb{position:relative;flex:1 0 118px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px 12px;font-size:14px;text-align:left;cursor:pointer;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chb[aria-current="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.chb i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--ink)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:120px;padding:0 16px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:8px;cursor:pointer;font-weight:700}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.alt{background:var(--panel);color:var(--ink);border-color:var(--line);min-width:0;font-weight:400}
.tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.spd{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.spd select{min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 10px}
@media (max-width:520px){.spd{margin-left:0}}
</style>
</head>
<body>


<div class="app">
  <div class="wrap" id="wrap"><div id="st"><svg id="sv" viewBox="0 0 1000 600"></svg></div></div>
  <div class="cap" id="cap" aria-live="off"></div>
  <input type="range" id="seek" min="0" max="100" step="0.05" value="0" aria-label="Denbora">
  <div class="chap" id="chap"></div>
  <div class="ctl">
    <button class="btn" id="bPlay" type="button"><svg viewBox="0 0 24 24" id="ico"><path d="M7 4v16l13-8z"/></svg><span id="lbl">Hasi</span></button>
    <button class="btn alt" id="bBack" type="button">− 5 s</button>
    <button class="btn alt" id="bFwd" type="button">+ 5 s</button>
    <span class="tm" id="tm">0:00 / 0:00</span>
    <label class="spd">Abiadura
      <select id="speed"><option value="0.7">Motela</option><option value="1" selected>Normala</option><option value="1.5">Azkarra</option></select>
    </label>
  </div>
</div>
<script>
/* ---------- Motorra ---------- */
const $=id=>document.getElementById(id);
const stg=$('st'),svg=$('sv'),wrap=$('wrap'),capEl=$('cap');
let SC=1;
const OB=[],CUES=[],CH=[];
let T0=0,TOTAL=1;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const fmt=(n,d)=>n.toFixed(d).replace('.',',').replace('-','−');
const EZ={io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,o:x=>1-Math.pow(1-x,3),l:x=>x};

class O{
  constructor(el,isSvg){this.el=el;this.tr={};this.ini={o:0,x:0,y:0,sx:1,sy:1,d:0};this.fx=null;this.dx=null;this.txt=null;this.svg=!!isSvg;this._z=0;OB.push(this);}
  last(p){const a=this.tr[p];return a?a[a.length-1].v1:this.ini[p];}
  to(p,t0,t1,v,e){const v0=this.last(p);(this.tr[p]||(this.tr[p]=[])).push({t0,t1,v0,v1:v,e:EZ[e||'io']});return this;}
  val(p,t){
    const a=this.tr[p];if(!a)return this.ini[p];
    let v=a[0].v0;
    for(const s of a){
      if(t>=s.t1)v=s.v1;
      else{if(t>=s.t0)v=s.v0+(s.v1-s.v0)*s.e((t-s.t0)/(s.t1-s.t0));break;}
    }
    return v;
  }
  apply(t){
    const s=this.el.style,o=this.val('o',t);
    if(this.txt){const q=this.txt(t);if(q!==this._q){this.el.textContent=q;this._q=q;}}
    if(o<=0.002){if(!this._z){s.opacity=0;this._z=1;}return;}
    this._z=0;
    if(this.svg){s.opacity=o;s.strokeDashoffset=this.len*(1-this.val('d',t));return;}
    let x=this.val('x',t),y=this.val('y',t),sx=this.val('sx',t),sy=this.val('sy',t);
    if(this.dx)x+=this.dx(t);
    if(this.fx)sx*=this.fx(t);
    s.opacity=o;s.transform=`translate(${x}px,${y}px) scale(${sx},${sy})`;
  }
}

function mk(cls,html,x,y,w){
  const e=document.createElement('div');
  e.className='a '+(cls||'');e.style.left=x+'px';e.style.top=y+'px';
  if(w!=null)e.style.width=w+'px';
  if(html!=null)e.innerHTML=html;
  stg.appendChild(e);return new O(e);
}
const T=(x,y,html,cls,w)=>mk(cls,html,x,y,w);
const C=(cx,y,w,html,cls)=>mk((cls||'')+' ctr',html,cx-w/2,y,w);
function R(x,y,w,h,cls){const o=mk('rect '+(cls||''),'',x,y,w);o.el.style.height=h+'px';return o;}
function DOT(cx,cy,d,cls){const o=mk('dot '+(cls||''),'',cx-d/2,cy-d/2,d);o.el.style.height=d+'px';return o;}
function LN(x1,y1,x2,y2){
  const e=document.createElementNS('http://www.w3.org/2000/svg','line');
  e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);
  e.setAttribute('class','ln');
  const L=Math.hypot(x2-x1,y2-y1);e.style.strokeDasharray=L;e.style.strokeDashoffset=L;e.style.opacity=0;
  svg.appendChild(e);const o=new O(e,true);o.len=L;return o;
}
function spans(o,init){
  return [...o.el.querySelectorAll('.sp')].map(e=>{const p=new O(e);p.ini.o=init===undefined?0:init;return p;});
}
function origin(o,v){o.el.style.transformOrigin=v;return o;}

function show(o,t,d,dy){
  d=d===undefined?1.2:d;dy=dy===undefined?10:dy;
  if(dy&&!o.tr.y){o.ini.y=dy;o.to('y',t,t+d,0,'o');}
  o.to('o',t,t+d,1,'o');return o;
}
function hide(o,t,d){o.to('o',t,t+(d===undefined?1:d),0,'l');return o;}
function grow(o,t,d,ax){ax=ax||'sx';o.ini[ax]=0;o.to(ax,t,t+d,1,'io');o.to('o',t,t+.25,1,'l');return o;}
function pop(o,t,d){d=d||.9;o.ini.sx=0;o.ini.sy=0;o.to('sx',t,t+d,1,'o').to('sy',t,t+d,1,'o').to('o',t,t+.3,1,'l');return o;}
function draw(l,t,d){l.to('d',t,t+d,1,'io').to('o',t,t+.25,1,'l');return l;}

function rc(o){
  const r=o.el.getBoundingClientRect(),s=stg.getBoundingClientRect();
  return{x:(r.left-s.left)/SC,y:(r.top-s.top)/SC,w:r.width/SC,h:r.height/SC};
}
/* Balio bat iturburutik helburura hegan doa (klona), eta helburua agertzen da */
function fly(src,dst,t0,d,dy){
  const a=rc(src),b=rc(dst);a.y+=(dy||0);
  const cs=getComputedStyle(src.el),cd=getComputedStyle(dst.el);
  const cl=src.el.cloneNode(true);
  cl.className='a';
  cl.style.cssText=`left:${a.x}px;top:${a.y}px;font-size:${cs.fontSize};font-family:${cs.fontFamily};font-weight:${cs.fontWeight};font-style:${cs.fontStyle};color:${cd.color};background:var(--panel);padding:0 .2em;border-radius:6px;transform-origin:center`;
  stg.appendChild(cl);
  const o=new O(cl);
  const k=(parseFloat(cd.fontSize)||1)/(parseFloat(cs.fontSize)||1);
  const dx=(b.x+b.w/2)-(a.x+a.w/2),dyy=(b.y+b.h/2)-(a.y+a.h/2);
  o.to('o',t0,t0+.5,1,'l').to('x',t0,t0+d,dx).to('y',t0,t0+d,dyy).to('sx',t0,t0+d,k).to('sy',t0,t0+d,k).to('o',t0+d,t0+d+.5,0,'l');
  dst.to('o',t0+d-.15,t0+d+.4,1,'l');
  return o;
}

function cue(a,b,text){CUES.push({a,b,text});}
function ttl(a,b,text){const o=T(40,20,text,'ttl');show(o,a,1,0);return o;}
function scene(name,dur,fn,last){
  const t0=T0,m=OB.length;
  fn(x=>t0+x,dur);
  if(!last)OB.slice(m).forEach(o=>{if(!o.el.classList.contains('sp'))o.to('o',t0+dur-2,t0+dur,0,'l');});
  if(name)CH.push({name,t0,t1:t0+dur});
  T0+=dur;
}

/* ---------- Erreprodukzioa eta kontrolak ---------- */
let t=0,playing=false,speed=1,lastTs=0,dirty=true,capTxt=null,capTok=0;
const fm=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function setCap(s){
  if(s===capTxt)return;capTxt=s;const tok=++capTok;
  capEl.classList.add('out');
  setTimeout(()=>{if(tok===capTok){capEl.textContent=s;capEl.classList.remove('out');}},220);
}
function render(){
  for(const o of OB)o.apply(t);
  const c=CUES.find(c=>t>=c.a&&t<c.b);setCap(c?c.text:'');
  $('seek').value=t;$('tm').textContent=fm(t)+' / '+fm(TOTAL);
  [...$('chap').children].forEach((b,i)=>{
    const h=CH[i],cur=t>=h.t0&&t<h.t1;
    b.setAttribute('aria-current',cur?'true':'false');
    b.lastElementChild.style.width=(clamp((t-h.t0)/(h.t1-h.t0),0,1)*100)+'%';
  });
}
function syncPlay(){
  $('lbl').textContent=playing?'Gelditu':(t>=TOTAL-0.05?'Berriro':'Hasi');
  $('ico').innerHTML=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';
}
function toggle(){
  if(playing)playing=false;
  else{if(t>=TOTAL-0.05)t=0;playing=true;}
  syncPlay();dirty=true;
}
function seek(v){t=clamp(v,0,TOTAL);dirty=true;syncPlay();}
function tick(ts){
  const dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
  if(playing){t+=dt*speed;if(t>=TOTAL){t=TOTAL;playing=false;syncPlay();}dirty=true;}
  if(dirty){render();dirty=false;}
  requestAnimationFrame(tick);
}
function fit(){SC=(wrap.clientWidth/1000)||1;stg.style.transform='scale('+SC+')';}
function loadFonts(){
  if(!document.fonts||!document.fonts.load)return Promise.resolve();
  const f=['400 40px "Source Serif 4"','italic 400 40px "Source Serif 4"','600 40px "Source Serif 4"','400 20px "Atkinson Hyperlegible"','700 20px "Atkinson Hyperlegible"'];
  return Promise.race([Promise.all(f.map(x=>document.fonts.load(x))),new Promise(r=>setTimeout(r,3000))]).catch(()=>{});
}
async function init(){
  fit();
  if(window.ResizeObserver)new ResizeObserver(()=>{fit();dirty=true;}).observe(wrap);
  await loadFonts();
  buildAll();
  TOTAL=T0;
  $('seek').max=TOTAL;
  CH.forEach((h,i)=>{
    const b=document.createElement('button');b.type='button';b.className='chb';
    b.style.flexGrow=h.t1-h.t0;b.innerHTML=h.name+'<i></i>';
    b.addEventListener('click',()=>seek(h.t0));
    $('chap').appendChild(b);
  });
  $('seek').addEventListener('input',e=>seek(parseFloat(e.target.value)));
  $('bPlay').addEventListener('click',toggle);
  $('bBack').addEventListener('click',()=>seek(t-5));
  $('bFwd').addEventListener('click',()=>seek(t+5));
  $('speed').addEventListener('change',e=>{speed=parseFloat(e.target.value);});
  document.addEventListener('keydown',e=>{
    const tg=e.target.tagName;
    if(e.key===' '&&tg!=='BUTTON'&&tg!=='SELECT'){e.preventDefault();toggle();}
    else if(e.key==='ArrowRight'&&tg!=='INPUT'){seek(t+5);}
    else if(e.key==='ArrowLeft'&&tg!=='INPUT'){seek(t-5);}
  });
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  playing=!reduce;syncPlay();dirty=true;
  requestAnimationFrame(ts=>{lastTs=ts;tick(ts);});
}
/* ---------- Eszenak ---------- */
const Vr='<i class="c-real">V<sub>erreala</sub></i>';
const Vh='<i class="c-approx">V<sub>hurbilketa</sub></i>';
const Ea='<i class="c-abs">E<sub>a</sub></i>';
const Ee='<i class="c-rel">E<sub>e</sub></i>';
const frac=(n,d)=>`<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const abs=x=>`<span class="abs">${x}</span>`;
const sh=(p,t,d)=>p.to('o',t,t+(d||.9),1,'l');

function buildAll(){
  /* --- Sarrera --- */
  scene(null,5.5,L=>{
    show(C(500,215,960,'Hurbilketa-erroreak','big'),.3,1.2);
    show(C(500,300,960,'Errore absolutua eta errore erlatiboa','sub'),1.3,1.2);
  });

  /* --- 1. Hurbilketa --- */
  scene('Hurbilketa',50,L=>{
    ttl(L(0),0,'1 · Hurbilketa');
    const lab1=C(500,66,600,'BALIO ERREALA','lab c-real'); show(lab1,L(1.5),1);
    const l1=C(500,90,1000,'<span class="sp c-real">√5</span> = <span class="sp c-real">2,236</span><span class="sp">067977…</span>','math fz64'); show(l1,L(2),1.2);
    const [s1a,s1b,s1c]=spans(l1,1);
    s1c.to('o',L(9.5),L(11.5),.25);
    const tb=rc(s1c);
    const br=R(tb.x,tb.y+tb.h+2,tb.w,3,'bg-muted'); show(br,L(10.5),1,0);
    const brl=C(tb.x+tb.w/2,tb.y+tb.h+10,300,'baztertzen ditugu','note'); show(brl,L(11),1);
    const lab2=C(500,238,600,'HURBILKETA','lab c-approx'); show(lab2,L(12.5),1);
    const l2=C(500,260,1000,'<span class="sp c-approx">2,236</span>','math fz64'); l2.to('o',L(12.4),L(12.6),1,'l');
    const [s2]=spans(l2,0);
    fly(s1b,s2,L(12.5),3);
    [l1,l2,lab1,lab2,br,brl].forEach(o=>hide(o,L(18),1.4));

    /* zenbaki-zuzen zabala */
    const wlB=C(382.4,190,140,'<span class="sp">√5</span>','axl c-real'); wlB.to('o',L(17.9),L(18.1),1,'l');
    const wlO=C(382.4,296,140,'<span class="sp">2,236</span>','axl c-approx'); wlO.to('o',L(17.9),L(18.1),1,'l');
    fly(s1a,spans(wlB,0)[0],L(18),2.6);
    fly(s2,spans(wlO,0)[0],L(18.5),2.6);
    const ax=R(80,250,840,3,'bg-muted'); grow(ax,L(19),2.5);
    for(let i=0;i<=5;i++){
      const x=80+i*168;
      show(R(x-1,244,2,14,'bg-muted'),L(20.2+i*.2),.8,0);
      show(C(x,264,90,fmt(2.2+0.02*i,2),'tk'),L(20.2+i*.2),.8,0);
    }
    const dO=DOT(382.4,251.5,26,'bg-approx'),dB=DOT(382.46,251.5,12,'bg-real');
    pop(dO,L(21.2));pop(dB,L(21.8));
    const win=R(367,214,32,72,'win'); show(win,L(27),1.2,0);

    /* handitzea */
    draw(LN(371,286,60,382),L(29),2.5); draw(LN(395,286,940,382),L(29),2.5);

    const c3=C(500,392,1000,`<span class="sp">= </span><span class="sp c-rel">${sEe}</span><span class="sp"> → </span><span class="sp c-rel"><b>% ${sPct}</b></span>`,'math fz44');
    c3.to('o',L(49),L(49.2),1,'l');
    const q3=spans(c3,0);
    const fw=rc(q3[1]).w;q3[1].el.style.width=fw+'px';q3[1].el.style.textAlign='left';
    const ra=rc(q3[2]);
    sh(q3[0],L(49),.8);sh(q3[1],L(49.5),.8);
    q3[1].txt=t=>fmt(ee*EZ.io(clamp((t-L(49.5))/3.5,0,1)),o.dec);
    sh(q3[2],L(53.5),.8); pop(q3[3],L(54.2));
    show(T(ra.x+ra.w/2-22,ra.y-6,'× 100','note'),L(53.5),1);
    show(C(500,472,900,sEa+' : '+sVr+' = '+sEe5+'… ≈ '+sEe,'note'),L(52.5),1);
    show(T(X0,216,'→ balio errealaren % '+sPct,'note c-rel'),L(55),1);

    cue(L(1),L(9),o.cap0);
    cue(L(9),L(20),o.cap1);
    cue(L(20),L(31),'Errore absolutua kalkulatzeko, balio errealari hurbilketa kentzen diogu eta balio absolutua hartzen dugu: '+sEa+' m.');
    cue(L(31),L(38),'Orain errore erlatiboa: errorea balio errealaren aldean neurtzen dugu.');
    cue(L(38),L(48),'Errore absolutua balio errealaz zatitzen dugu: '+sEa+' : '+sVr+'.');
    cue(L(48),L(58),'Emaitza '+sEe5+'… da; biribilduta, '+sEe+'. Bider 100 eginda, errore erlatiboa % '+sPct+' da.');
  });
